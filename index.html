<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Какой ты инженер? — СШФ СФУ</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#182b42;background:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:680px;margin:25px auto;background:white;border-radius:24px;padding:30px;box-shadow:0 12px 40px #15365018}.eyebrow{font-weight:700;color:#087bba;letter-spacing:.08em;font-size:12px}h1{font-size:34px;margin:12px 0}h2{font-size:25px;line-height:1.3}p{line-height:1.55;color:#52647a}.progress{height:7px;background:#e5edf4;border-radius:20px;overflow:hidden;margin:25px 0}.bar{height:100%;background:#008acb;width:0;transition:.25s}.choices{display:grid;gap:11px;margin:22px 0}.choice{border:1.5px solid #d7e4ee;border-radius:14px;padding:16px;text-align:left;background:white;font-size:16px;cursor:pointer;color:#182b42;line-height:1.35}.choice:hover{border-color:#008acb;background:#f2faff}.primary{border:0;border-radius:12px;padding:15px 23px;background:#087bb5;color:white;font-size:16px;font-weight:700;cursor:pointer}.secondary{border:0;background:transparent;color:#58728c;cursor:pointer;padding:12px 0}.meta{color:#8193a5;font-size:13px}.result{padding:20px;border-radius:18px;background:#edf8fe;margin:22px 0}.tag{display:inline-block;background:#d7f0ff;color:#006aa0;padding:8px 12px;border-radius:30px;font-size:13px;font-weight:bold}.foot{font-size:12px;color:#718397;margin-top:25px}@media(max-width:500px){body{padding:8px}.wrap{padding:23px;margin:6px auto}h1{font-size:29px}h2{font-size:22px}}</style></head><body><main class="wrap"><div class="eyebrow">САЯНО-ШУШЕНСКИЙ ФИЛИАЛ СФУ</div><div id="app"></div></main><script>
const tracks={energy:{name:'13.03.02 — Электроэнергетика и электротехника',role:'Ты — повелитель энергии ⚡',desc:'Тебе интересно, как устроены сложные механизмы, как работает оборудование и откуда берётся электричество.',next:'На Дне открытых дверей узнай, как устроена работа гидроэлектростанции.'},build:{name:'08.03.01 — Строительство',role:'Ты — создатель больших сооружений 🏗️',desc:'Ты любишь видеть результат, продумывать конструкцию и искать решения, которые выдержат испытание временем.',next:'На Дне открытых дверей спроси, как проектируют плотины и гидротехнические сооружения.'},it:{name:'09.03.02 — Информационные системы и технологии',role:'Ты — архитектор цифровых решений 💻',desc:'Тебе нравится разбираться в системах, находить закономерности и придумывать, как автоматизировать сложные процессы.',next:'На Дне открытых дверей узнай, какие цифровые технологии используют будущие специалисты.'}};
const questions=[{q:'Представь: ты руководишь командой, которая создаёт новый технологический объект. Какую роль выберешь?',a:[['Отвечать за то, чтобы оборудование работало без сбоев','energy'],['Продумать конструкцию и убедиться, что она надёжна','build'],['Создать систему, которая будет всем управлять','it']]},{q:'На экскурсии тебе разрешили заглянуть за одну закрытую дверь. Какую выберешь?',a:[['В зал с огромными работающими механизмами','energy'],['В лабораторию, где испытывают материалы и конструкции','build'],['В диспетчерскую с экранами и цифровыми системами','it']]},{q:'У команды возникла проблема. Что тебе интереснее всего выяснить?',a:[['Почему устройство перестало работать','energy'],['Почему конструкция не выдержала нагрузку','build'],['Почему программа выдаёт неправильный результат','it']]},{q:'Какой результат работы радует тебя больше?',a:[['Запущенная установка, которая производит энергию','energy'],['Готовый объект, который простоит десятилетия','build'],['Умная система, которая делает работу проще','it']]},{q:'Ты участвуешь в проекте будущего города. Что возьмёшь на себя?',a:[['Надёжное энергоснабжение','energy'],['Мосты, здания и инженерные сооружения','build'],['Цифровое управление городскими сервисами','it']]},{q:'Выбери финальную суперспособность инженера.',a:[['Укрощать мощность','energy'],['Превращать идеи в реальные конструкции','build'],['Заставлять сложные системы работать умнее','it']]}];
let step=-1, answers=[];const app=document.getElementById('app');function render(){if(step===-1){app.innerHTML=`<h1>Какой ты инженер?</h1><p>6 коротких вопросов. Три инженерных направления. Узнай, какая роль тебе ближе, и получи подсказку для Дня открытых дверей.</p><button class="primary" onclick="start()">Начать тест →</button><div class="foot">Развлекательный профориентационный тест. Результат не является профессиональной диагностикой.</div>`;return}if(step<questions.length){const x=questions[step];app.innerHTML=`<div class="meta">ВОПРОС ${step+1} ИЗ ${questions.length}</div><div class="progress"><div class="bar" style="width:${100*step/questions.length}%"></div></div><h2>${x.q}</h2><div class="choices">${x.a.map((a,i)=>`<button class="choice" onclick="pick(${i})">${a[0]}</button>`).join('')}</div>${step?'<button class="secondary" onclick="back()">← Назад</button>':''}`;return}const score={energy:0,build:0,it:0};answers.forEach(k=>score[k]++);const top=Math.max(...Object.values(score));let winner=Object.keys(score).filter(k=>score[k]===top);winner=winner[0];const t=tracks[winner];let second=Object.keys(score).filter(k=>k!==winner).sort((a,b)=>score[b]-score[a])[0];app.innerHTML=`<div class="tag">ТВОЙ РЕЗУЛЬТАТ</div><h1>${t.role}</h1><div class="result"><strong>${t.name}</strong><p>${t.desc}</p><p><strong>Твоя миссия на ДОД:</strong> ${t.next}</p></div>${score[second]>=2?`<p>Тебе также может быть интересно направление «${tracks[second].name}».</p>`:''}<button class="primary" onclick="window.print()">Сохранить результат / PDF</button> <button class="secondary" onclick="restart()">Пройти заново</button><div class="foot">Это игровой тест по интересам, а не официальный выбор специальности. Познакомься со всеми тремя направлениями!</div>`}function start(){step=0;render()}function pick(i){answers[step]=questions[step].a[i][1];step++;render()}function back(){step--;render()}function restart(){step=-1;answers=[];render()}render();
</script></body></html>
